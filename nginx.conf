# Reverse proxy for the `proxy` compose profile.
#
# Mounted as /etc/nginx/templates/default.conf.template: the official nginx image runs envsubst
# on it at start-up, so ${NGINX_*} placeholders come from the nginx service environment.
# Lower-case $variables are nginx's own and are left alone.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream app_upstream {
    server app:8000;
}

server {
    listen 80;
    server_name ${NGINX_SERVER_NAME};
    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    # Shared with the app container (static_data volume -> /usr/src/app/staticfiles).
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_pass http://app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
